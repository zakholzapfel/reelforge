name: Bundled desktop previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["reelforge/**", "scripts/**", "installer/**", "desktop_entry.py", "pyproject.toml", ".github/workflows/desktop-build.yml"]
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop build dependencies
        run: python -m pip install -e ".[desktop,build]"
      - name: Install Mac media build prerequisites
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Install Windows media build environment
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: Fetch verified tool inputs
        run: python scripts/prepare_tools.py
      - name: Build Mac media tools
        if: runner.os == 'macOS'
        run: bash scripts/build_media_tools.sh
      - name: Build Windows media tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build_media_tools.sh
      - name: Check tool versions and required encoders
        run: python scripts/prepare_tools.py --finalize
      - name: Prepare Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Fetch and verify Microsoft WebView2 bootstrapper
        if: runner.os == 'Windows'
        run: ./scripts/prepare_windows_webview.ps1
      - name: Build and exercise bundled desktop app
        run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ReelForge-${{ matrix.os }}
          path: |
            desktop-dist/*.zip
            desktop-dist/*.dmg
            desktop-dist/*-Setup.exe
            desktop-dist/SHA256SUMS.txt
            desktop-dist/README-DESKTOP.txt
          if-no-files-found: error
