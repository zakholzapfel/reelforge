[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge"
version = "0.5.0"
description = "Preview, download, merge, and organize video collections for local media libraries."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "yt-dlp[default]>=2026.8.19"]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]
build = ["pyinstaller>=6,<7", "Pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.50"]

[project.scripts]
reelforge = "reelforge.__main__:main"
reelforge-desktop = "reelforge.desktop:main"

[tool.setuptools.package-data]
reelforge = ["static/*"]

[tool.setuptools.packages.find]
include = ["reelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

